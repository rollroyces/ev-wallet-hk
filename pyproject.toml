[project]
name = "ev-wallet-hk"
version = "0.1.0"
description = "EV Wallet HK — preauth-backed charging wallet for Hong Kong"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary-Commercial"
readme = "README.md"
authors = [{ name = "rollroyces" }]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.1",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.20",
  "stripe>=11.0",
  "python-ulid>=4.0,<5.0",
  "google-auth>=2.37,<3.0",
  "cryptography>=43.0,<46.0",
  "email-validator>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "fakeredis>=2.26",
  "websockets>=13",
  "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evwallet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM101", "SIM102", "RUF012"]  # RUF012 = mutable class constants like _RESERVED

[tool.mypy]
python_version = "3.12"
strict_optional = true
no_implicit_optional = true
warn_unreachable = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]