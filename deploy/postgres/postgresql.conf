# =============================================================================
# Postgres tuning — single-instance, ~8GB RAM, EV wallet workload
# Apply by mounting to /etc/postgresql/postgresql.conf in compose.
# Postgres ignores this file unless invoked with -c config_file=...
# In compose we let the entrypoint pick it up via POSTGRES_INITDB_ARGS.
# =============================================================================

# ---- Connection / memory --------------------------------------------------
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 2GB
work_mem = 4MB
maintenance_work_mem = 128MB

# ---- WAL / durability (CRITICAL — DO NOT CHANGE) -------------------------
wal_level = replica
synchronous_commit = on              # ACID ledger requires this
full_page_writes = on
fsync = on
wal_sync_method = fdatasync
checkpoint_completion_target = 0.9

# ---- Replication / WAL retention ------------------------------------------
max_wal_size = 2GB
min_wal_size = 512MB
wal_keep_size = 512MB
max_wal_senders = 3

# ---- Query planner --------------------------------------------------------
random_page_cost = 1.1               # SSD storage
effective_io_concurrency = 200

# ---- Locale / timezone ---------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'Asia/Hong_Kong'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# ---- Logging -------------------------------------------------------------
logging_collector = on
log_destination = 'stderr'
log_min_duration_statement = 500     # log slow queries (>500ms)
log_checkpoints = on
log_connections = off                # noisy under compose
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ---- Stats / monitoring ---------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_activities = on